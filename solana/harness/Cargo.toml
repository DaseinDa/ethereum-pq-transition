[package]
name = "pqsol"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Client for the Solana enrollment run: wallets, ML-DSA-44 keys, v1 transactions, block statistics"
publish = false

[dependencies]
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2"
fips204 = { version = "=0.5.0", default-features = false, features = ["ml-dsa-44"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
