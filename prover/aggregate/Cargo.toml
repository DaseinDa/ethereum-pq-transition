[package]
name = "pq-migrate-tree"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
p3-air = "=0.9.0-rc.1"
p3-batch-stark = "=0.9.0-rc.1"
p3-challenger = "=0.9.0-rc.1"
p3-commit = "=0.9.0-rc.1"
p3-dft = "=0.9.0-rc.1"
p3-field = "=0.9.0-rc.1"
p3-fri = "=0.9.0-rc.1"
p3-keccak-air = "=0.9.0-rc.1"
p3-koala-bear = "=0.9.0-rc.1"
p3-lookup = "=0.9.0-rc.1"
p3-matrix = "=0.9.0-rc.1"
# Turns on Rayon in every Plonky3 crate (Cargo feature unification).
p3-maybe-rayon = { version = "=0.9.0-rc.1", features = ["parallel"] }
p3-merkle-tree = "=0.9.0-rc.1"
p3-symmetric = "=0.9.0-rc.1"
p3-uni-stark = "=0.9.0-rc.1"
rand = { version = "=0.10.3", features = ["std_rng", "sys_rng"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = "1.0"
serde_json = "1.0"
num-bigint = "0.4"
num-traits = "0.2"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
# Reference implementations for the witness cross-checks only (never in the AIR).
sha2 = "0.10"
hmac = "0.12"

p3-batch-stark-c3 = { path = "../crates/p3-batch-stark-c3", features = ["parallel"] }
p3-batch-stark-c3n = { path = "../crates/p3-batch-stark-c3n", features = ["parallel"] }
p3-batch-stark-c3np = { path = "../final-verifier/crates/p3-batch-stark-c3np", features = ["parallel"] }
p3-merkle-tree-ps = { path = "../final-verifier/crates/p3-merkle-tree-ps", features = ["parallel"] }
p3-poseidon2-air = "=0.9.0-rc.1"

[profile.optimized]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 3

[patch.crates-io]
p3-batch-stark = { path = "../pinned-deps/p3-batch-stark" }
p3-merkle-tree = { path = "../pinned-deps/p3-merkle-tree" }

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
ag-negative-tests = []
